include:
  - path: ./zitadel-compose/docker-compose.yml

services:
  zitadel-internal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/zitadel-internal.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zitadel
    depends_on:
      zitadel-api:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    restart: unless-stopped
    ports:
      - ${AUTH_SERVICE_PORT:-5003}:5003
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-demo-auth-secret-for-local-dev-only!!}
      ZITADEL_ISSUER: http://zitadel-internal
      ZITADEL_SERVICE_ACCOUNT_TOKEN: ${ZITADEL_SERVICE_ACCOUNT_TOKEN:-}
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks:
      - zitadel
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-internal:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:5003/health || exit 1
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 120s

  app1:
    build:
      context: ./app1
    restart: unless-stopped
    ports:
      - ${APP1_PORT:-5001}:5001
    networks:
      - zitadel
    depends_on:
      auth-service:
        condition: service_started

  app2:
    build:
      context: ./app2
    restart: unless-stopped
    ports:
      - ${APP2_PORT:-5002}:5002
    networks:
      - zitadel
    depends_on:
      auth-service:
        condition: service_started

  app1api:
    build:
      context: ./app1api
    restart: unless-stopped
    ports:
      - ${APP1API_PORT:-5005}:5005
    environment:
      Auth__Secret: ${AUTH_SECRET}
      ASPNETCORE_URLS: http://0.0.0.0:5005
    networks:
      - zitadel
    depends_on:
      auth-service:
        condition: service_started
